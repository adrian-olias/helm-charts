{{- range .Values.apps }}
{{- if and (or (not (hasKey . "enabled")) .enabled) $.Values.quota.enabled }}
{{- $app := required "every app needs a name" .name }}
{{- $namespace := required (printf "app %s needs a namespace" $app) .namespace }}
{{- $quota := $.Values.quota.hard }}
{{- if and (hasKey . "quota") .quota (hasKey .quota "hard") }}
{{- $quota = .quota.hard }}
{{- end }}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: guardrails
  namespace: {{ $namespace }}
  labels:
    {{- include "argocd-template.labels" $ | nindent 4 }}
spec:
  hard:
    {{- toYaml $quota | nindent 4 }}
{{- end }}
{{- end }}
