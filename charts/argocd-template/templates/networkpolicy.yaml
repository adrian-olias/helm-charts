{{- if .Values.networkPolicy.enabled }}
{{- $namespace := include "argocd-template.namespace" . }}
# Once a pod is selected by an ingress policy, any traffic not allowed by
# some policy is dropped. These are the only ways in.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-same-namespace
  namespace: {{ $namespace }}
  labels:
    {{- include "argocd-template.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
{{- range .Values.networkPolicy.allowFrom }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-{{ . }}
  namespace: {{ $namespace }}
  labels:
    {{- include "argocd-template.labels" $ | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
{{- end }}
{{- end }}
