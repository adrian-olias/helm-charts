{{- if .Values.limits.enabled }}
apiVersion: v1
kind: LimitRange
metadata:
  name: guardrails
  namespace: {{ include "argocd-template.namespace" . }}
  labels:
    {{- include "argocd-template.labels" . | nindent 4 }}
spec:
  limits:
    - type: Container
      {{- with .Values.limits.default }}
      default:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.limits.defaultRequest }}
      defaultRequest:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.limits.max }}
      max:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
