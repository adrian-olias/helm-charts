nameOverride: ""
fullnameOverride: ""

commonLabels: {}

image:
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicaCount: 1

strategy: {}

containerPort: 8080

podAnnotations: {}
podLabels: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountToken: false

rbac:
  create: false
  rules: []

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

tmpDir:
  enabled: true

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

env: {}

persistence:
  enabled: false
  mountPath: /data
  size: ""
  storageClassName: ""
  accessModes: [ReadWriteOnce]
  annotations: {}

configFiles: []

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: traefik
  annotations: {}
  hosts: []
  tls: []

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false
  minAvailable: 1

serviceMonitor:
  enabled: false
  path: /metrics
  interval: 30s
  labels: {}

sealedSecret:
  enabled: false
  encryptedData: {}

nodeSelector: {}
tolerations: []
affinity: {}
